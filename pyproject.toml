[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insider-trading"
version = "0.1.0"
description = "Congressional insider trading analysis tool"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "requests-cache",
    "yfinance",
    "camelot-py[cv]",
    "pytesseract",
    "pypdf",
    "pdf2image",
    "Pillow",
    "pyarrow",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "aiohttp>=3.9",
    "duckdb>=0.9",
]

[project.scripts]
insider-trading = "analyzer.cli:main"