[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptr-alpha"
version = "0.1.0"
description = "Congressional PTR disclosure analysis tool"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "requests",
    "requests-cache",
    "yfinance",
    "camelot-py[cv]",
    "pdfplumber>=0.11",
    "pytesseract",
    "pdf2image",
    "Pillow",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "aiohttp>=3.9",
    "duckdb>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
ptr-alpha = "analyzer.cli:main"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::cryptography.utils.CryptographyDeprecationWarning",
]