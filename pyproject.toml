[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptr-alpha"
version = "0.1.0"
description = "Congressional PTR disclosure analysis tool"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "requests",
    "requests-cache",
    "yfinance",
    "camelot-py",
    "pdfplumber>=0.11",
    "pytesseract",
    "pdf2image",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "aiohttp>=3.9",
    "duckdb>=0.9",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "bandit>=1.7",
]

[project.scripts]
ptr-alpha = "analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["analyzer*"]

[tool.ruff.lint.per-file-ignores]
# E402: standalone scripts and tests bootstrap sys.path before importing the
# project package, so a module-level import after a sys.path.insert is intended.
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "data"]
skips = ["B404", "B603", "B607"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::cryptography.utils.CryptographyDeprecationWarning",
]
